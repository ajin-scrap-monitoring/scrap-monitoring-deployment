# Edge v2 ingest routes. Bearer authentication stays in Backend and Camera Media Service.
location ~ "^/api/edge/v2/(configurations|measurements|assessments|status)$" {
    if ($request_method != POST) { return 405; }
    include /etc/nginx/includes/proxy-common.conf;
    proxy_pass http://dashboard_backend;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

# Camera frames use WebSocket Secure and a camera-specific Bearer token.
location ~ "^/api/v1/cameras/[A-Za-z0-9][A-Za-z0-9._~-]{0,127}/stream$" {
    include /etc/nginx/includes/proxy-websocket.conf;
    proxy_pass http://edge_media_ingest;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
}
