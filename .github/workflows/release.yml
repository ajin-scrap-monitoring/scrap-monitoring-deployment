name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_MANIFEST: release/manifests/${{ github.ref_name }}.json

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: tools/go.sum

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: 0.12.15
          python-version: 3.13.15
          enable-cache: false

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2  # v2.3.0
        with:
          version: v5.5.1
          cache-binary: true

      - name: Install validation tooling
        run: tools/install-validation

      - name: Validate repository
        run: tests/validate-repository

      - name: Validate release input
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s\n' "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            printf '%s\n' "Release tag commit is not included in origin/main." >&2
            exit 1
          fi

          .venv/bin/python release/validate-manifest \
            --version "${RELEASE_TAG}" \
            --manifest "${RELEASE_MANIFEST}" \
            --require-public-packages
          .venv/bin/python release/validate-targets \
            --version "${RELEASE_TAG}" \
            --manifest "${RELEASE_MANIFEST}"

      - name: Build and verify release assets
        run: |
          release/pull-images "${RELEASE_MANIFEST}" build/images
          .venv/bin/python release/build-assets \
            --version "${RELEASE_TAG}" \
            --manifest "${RELEASE_MANIFEST}" \
            --image-directory build/images \
            --output dist
          .venv/bin/python release/verify-assets \
            --version "${RELEASE_TAG}" \
            --directory dist

      - name: Store verified release assets
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-assets-${{ github.ref_name }}
          path: |
            dist/SHA256SUMS
            dist/scrap-monitoring-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist

      - name: Validate downloaded assets
        run: |
          expected_assets="$(
            printf '%s\n' "SHA256SUMS"
            for target in edge server; do
              for scenario in hardware simulation; do
                for mode in online offline; do
                  printf 'scrap-monitoring-%s-%s-%s-%s.tar.gz\n' \
                    "${target}" "${scenario}" "${RELEASE_TAG}" "${mode}"
                done
              done
            done | sort
          )"
          actual_assets="$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          if [[ "${actual_assets}" != "${expected_assets}" ]]; then
            printf '%s\n' "Downloaded release asset set does not match." >&2
            exit 1
          fi
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if release_state="$(gh release view "${RELEASE_TAG}" \
            --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "${release_state}" != "true" ]]; then
              printf '%s\n' "Release is already published: ${RELEASE_TAG}" >&2
              exit 1
            fi
          else
            gh release create "${RELEASE_TAG}" \
              --draft \
              --generate-notes \
              --title "${RELEASE_TAG}" \
              --verify-tag
          fi

          gh release upload "${RELEASE_TAG}" dist/* --clobber

          expected_assets="$(
            printf '%s\n' "SHA256SUMS"
            for target in edge server; do
              for scenario in hardware simulation; do
                for mode in online offline; do
                  printf 'scrap-monitoring-%s-%s-%s-%s.tar.gz\n' \
                    "${target}" "${scenario}" "${RELEASE_TAG}" "${mode}"
                done
              done
            done | sort
          )"
          actual_assets="$(gh release view "${RELEASE_TAG}" --json assets \
            --jq '[.assets[].name] | sort | .[]')"
          if [[ "${actual_assets}" != "${expected_assets}" ]]; then
            printf '%s\n' "Release asset set does not match the expected set." >&2
            exit 1
          fi

          gh release edit "${RELEASE_TAG}" --draft=false
