name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Python tooling
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check --requirement requirements-tooling.txt

      - name: Validate repository
        run: tests/validate-repository
